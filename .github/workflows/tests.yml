name: Model-free checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: workspace/cog-verify-candidate
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: cogcloud-ai/cog-op-builder
          path: workspace/cog-op-builder
          persist-credentials: false
      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: v0.84.1
          run-install: false
      - name: Install sibling environments
        run: python3 workspace/cog-op-builder/scripts/bootstrap.py --workspace workspace --install
      - name: Run model-free tests
        run: python3 workspace/cog-op-builder/scripts/verify.py --workspace workspace --package cog-verify-candidate
      - name: Build pinned isolation image and exercise confinement
        if: runner.os == 'Linux'
        run: |
          docker pull python:3.11-slim
          base=$(docker image inspect python:3.11-slim --format '{{index .RepoDigests 0}}')
          docker build --build-arg BASE_IMAGE="$base" -t cog-verification -f workspace/cog-verify-candidate/isolation/Dockerfile workspace/cog-verify-candidate
          image=$(docker image inspect cog-verification --format '{{.Id}}')
          cd workspace/cog-verify-candidate
          COG_VERIFY_ISOLATION_IMAGE="$image" pixi run test
  isolation-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Check the isolation lock matches requirements.in and PyPI hashes
        # uv keeps the committed pins as preferences, so this fails only when
        # requirements.in changed, the lock was edited, or PyPI's hashes differ
        # (including new files uploaded for a pinned version).
        run: |
          uv pip compile isolation/requirements.in --universal --python-version 3.11 --generate-hashes --quiet -o isolation/requirements.txt
          git diff --exit-code isolation/requirements.txt
